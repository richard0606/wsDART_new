dart_aim_node:
  ros__parameters:
    bound_rate: 115200
    conf_threshold: 0.25
    crop_height: 720
    crop_width: 1280
    enable_record: false
    h_max: 80
    h_min: 35
    image_topic: /image_raw
    infer_backend: BPU
    max_area: 130.0
    model_default_target: 2
    model_input_height: 576
    model_input_width: 768
    model_nms_threshold: 0.7
    model_path: ''
    model_path_bpu: /root/dart_ws_on/src/yq_dart_aim/model/praysky_coord_576x768.bin
    model_path_cpu: /root/dart_ws_on/src/yq_dart_aim/model/praysky_dart_576x768_cut.onnx
    model_result_max_age_ms: 0
    morph_dilate_kernel_size: 5
    morph_kernel_size: 3
    offset_0_0: 35.0
    offset_0_1: 35.0
    offset_0_2: 35.0
    offset_0_3: 35.0
    offset_1_0: 35.0
    offset_1_1: 35.0
    offset_1_2: 35.0
    offset_1_3: 35.0
    offset_2_0: 12.0
    offset_2_1: 29.0
    offset_2_2: 34.0
    offset_2_3: 30.0
    offset_y: 0.0
    p_err: 8.0
    publish_compressed_mask: true
    publish_debug_image: true
    s_max: 255
    s_min: 75
    # 调参通道（PC 用 tools/tune.py 连过来；留空=关闭）
    # 三种写法任选其一：
    #   tcp:8766           走 USB 网络（Type-C 线连 PC，默认；PC 端零依赖）
    #   /dev/ttyACM1       USB-TTL 串口（第二个口，ttyACM0 给下位机 MCU）
    #   /dev/ttyS1          板载硬件 UART（排针）
    tune_port: tcp:8766
    tune_baud: 115200
    usart_port: /dev/ttyACM0
    use_model: true
    use_serial: true
    v_max: 255
    v_min: 50
