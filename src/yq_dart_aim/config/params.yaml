# ============================================================
# RM 飞镖镖架视觉识别 - 参数配置文件
# ============================================================
# 所有参数均支持运行时动态修改（ros2 param set）
# 调试提示：如果目标识别不稳定，优先调整 HSV 阈值参数
# ============================================================

dart_aim_node:
  ros__parameters:

    # ==================== HSV 颜色阈值 ====================
    # 用于目标颜色筛选，将图像转为 HSV 色彩空间后进行二值化
    # 调节技巧：
    #   1. 先用 foxglove 查看 HSV 图像
    #   2. 观察目标区域的 H/S/V 值范围
    #   3. 逐步缩小范围直到只保留目标

    # 色相(Hue)范围：0-180（OpenCV 中 HSV 的 H 范围）
    # h_min 增大 → 排除更多黄色/橙色区域
    # h_max 减小 → 排除更多绿色/蓝色区域
    h_min: 35   # 色相下限
    h_max: 80   # 色相上限

    # 饱和度(Saturation)范围：0-255
    # s_min 增大 → 排除低饱和度（灰色/白色）区域
    s_min: 70   # 饱和度下限
    s_max: 255  # 饱和度上限

    # 明度(Value)范围：0-255
    # v_min 增大 → 排除暗色区域（阴影、背景暗处）
    # v_max 减小 → 排除过曝区域（强光反射）
    v_min: 50   # 明度下限
    v_max: 255  # 明度上限

    # ==================== 形态学处理 ====================
    # 开运算：去除小噪点（先腐蚀后膨胀）
    # 增大 → 去除更大噪点，但可能丢失小目标
    # 必须为奇数，最小值 1
    morph_kernel_size: 3

    # 膨胀：连接断裂区域
    # 增大 → 连接更大间隙，但可能合并相邻目标
    # 必须为奇数，最小值 1
    morph_dilate_kernel_size: 5

    # ==================== 目标筛选 ====================
    # max_area: 最大面积阈值（像素）
    # 增大 → 允许更大目标被检测到
    # 减小 → 排除大面积背景干扰
    max_area: 130.0

    # circle_mask: 是否启用圆形匹配评分
    # true → 使用最小外接圆和边界框进行更严格的圆形筛选
    # false → 仅使用面积筛选（推荐大多数场景使用）
    circle_mask: true

    # ==================== 坐标计算 ====================
    # p_err: 误差缩放系数
    # 增大 → 放大误差，下位机响应更灵敏（适合远距离）
    # 减小 → 缩小误差，下位机响应更平稳（适合近距离精细调节）
    p_err: 8.0

    # offset_y: Y方向偏移补偿（像素）
    # 正值 → 瞄准点向下偏移（目标需要瞄高）
    # 负值 → 瞄准点向上偏移（目标需要瞄低）
    offset_y: 0.0

    # ==================== 偏移查找表 ====================
    # 格式：offset_[目标类型][飞镖编号] = X方向偏移量（像素）
    # 目标类型：0=无目标（默认）, 1=前哨站, 2=基地
    # 飞镖编号：0, 1, 2, 3（按发射顺序）
    #
    # 调节方法：
    #   1. 切换到对应目标类型
    #   2. 观察瞄准十字与目标中心的偏差
    #   3. 增大 offset → 瞄准点向右移动
    #   4. 减小 offset → 瞄准点向左移动

    # target 0: 无目标（默认偏移）
    offset_0_0: 35.0   # 无目标, 飞镖0
    offset_0_1: 35.0   # 无目标, 飞镖1
    offset_0_2: 35.0   # 无目标, 飞镖2
    offset_0_3: 35.0   # 无目标, 飞镖3

    # target 1: 前哨站
    offset_1_0: 35.0   # 前哨站, 飞镖0
    offset_1_1: 35.0   # 前哨站, 飞镖1
    offset_1_2: 35.0   # 前哨站, 飞镖2
    offset_1_3: 35.0   # 前哨站, 飞镖3

    # target 2: 基地（通常需要不同偏移量）
    offset_2_0: 12.0   # 基地, 飞镖0
    offset_2_1: 29.0   # 基地, 飞镖1
    offset_2_2: 34.0   # 基地, 飞镖2
    offset_2_3: 30.0   # 基地, 飞镖3

    # ==================== 串口通信 ====================
    # bound_rate: 串口波特率
    # 常用值：9600, 115200, 230400
    # 注意：修改后需要重新连接串口
    bound_rate: 115200

    # usart_port: 串口设备路径
    # Linux: /dev/ttyACM0 或 /dev/ttyUSB0
    # 修改后需要重启节点或重新设置 use_serial
    usart_port: "/dev/ttyACM0"

    # use_serial: 是否启用串口
    # true → 发送串口数据（正常比赛模式）
    # false → 仅发布 ROS 话题（调试模式，不需要下位机）
    use_serial: true

    # ==================== 图像裁剪 ====================
    # 中心裁剪区域大小（像素）
    # 减小 → 处理速度更快，但视野范围更小
    # 增大 → 视野更大，但处理速度略慢
    # 建议保持与相机分辨率匹配或略小
    crop_width: 1024
    crop_height: 480

    # ==================== 调试输出 ====================
    # publish_debug_image: 是否发布带标注的调试图像
    # 发布到 /dart_debug/image（原始）和 /dart_debug/image_compressed（压缩）
    publish_debug_image: true

    # publish_compressed: 是否发布压缩调试图像
    # 压缩格式为 JPEG，质量 90
    publish_compressed: true

    # publish_compressed_mask: 是否发布压缩 mask 图像
    # 压缩格式为 PNG（无损）
    publish_compressed_mask: true

    # image_topic: 订阅的图像话题名称
    # 默认由海康相机驱动发布
    image_topic: "/image_raw"

    # ==================== 模型检测 ====================
    # use_model: 是否使用模型检测（true=模型, false=HSV 阈值）
    use_model: false

    # model_path: 模型文件路径（ONNX 格式）
    model_path: ""

    # conf_threshold: 模型检测置信度阈值
    conf_threshold: 0.5

    # nms_threshold: 非极大值抑制阈值
    nms_threshold: 0.45
