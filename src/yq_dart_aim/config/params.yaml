dart_aim_node:
  ros__parameters:
    bound_rate: 115200
    conf_threshold: 0.25
    crop_height: 720
    crop_width: 1280
    enable_record: false
    h_max: 80
    h_min: 35
    image_topic: /image_raw
    # 相机端直出的 JPEG；留空则退回订阅 raw /image_raw（2.76MB/帧，DDS 吞吐很低）
    image_topic_compressed: /image_raw/jpeg
    # auto = 按平台自动选：编译期默认可用就用它，否则 BPU -> OpenVINO -> ORT -> DNN 回退
    # 也可显式写 CPU / BPU / OpenVINO / DNN；launch 参数 infer_backend 可覆盖本值
    infer_backend: auto
    max_area: 130.0
    model_default_target: 2
    model_input_height: 576
    model_input_width: 768
    model_nms_threshold: 0.7
    model_path: ''
    # 相对路径按 <包 share>/model/ 解析；绝对路径原样使用。
    # CPU(ORT) 与 OpenVINO 共用同一份 cut .onnx，BPU 用 RDK X5 量化 .bin
    model_path_bpu: praysky_coord_576x768.bin
    model_path_cpu: praysky_coord_576x768_cut.onnx
    model_result_max_age_ms: 0
    # 调试图发布上限（/dart_debug、/model_debug 的 compressed 话题）
    # 桌面端 NUC 上资源充足，按主回调上限放开
    debug_max_fps: 60
    morph_dilate_kernel_size: 5
    morph_kernel_size: 3
    offset_0_0: 35.0
    offset_0_1: 35.0
    offset_0_2: 35.0
    offset_0_3: 35.0
    offset_1_0: 35.0
    offset_1_1: 35.0
    offset_1_2: 35.0
    offset_1_3: 35.0
    offset_2_0: 12.0
    offset_2_1: 29.0
    offset_2_2: 34.0
    offset_2_3: 30.0
    offset_y: 0.0
    p_err: 8.0
    publish_compressed_mask: true
    publish_debug_image: true
    s_max: 255
    s_min: 75
    # 调参通道（PC 用 tools/tune.py 连过来；留空=关闭）
    # 三种写法任选其一：
    #   tcp:8766           走 USB 网络（Type-C 线连 PC，默认；PC 端零依赖）
    #   /dev/ttyACM1       USB-TTL 串口（第二个口，ttyACM0 给下位机 MCU）
    #   /dev/ttyS1          板载硬件 UART（排针）
    tune_port: tcp:8766
    tune_baud: 115200
    usart_port: /dev/ttyACM0
    use_model: true
    use_serial: true
    v_max: 255
    v_min: 50
